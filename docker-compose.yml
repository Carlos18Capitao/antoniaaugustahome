services:
  # Nginx
  nginx:
    image: nginx:alpine
    container_name: aa_nginx
    ports:
      - "82:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
      - frontend
    networks:
      - aa_network

  # Laravel App
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: aa_app
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - mysql
      - redis
    environment:
      - DB_HOST=mysql
      - DB_DATABASE=antonio_augusta
      - DB_USERNAME=aa_user
      - DB_PASSWORD=aa_secret
      - REDIS_HOST=redis
    networks:
      - aa_network

  # Vue Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aa_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost/api
    networks:
      - aa_network

  # MySQL
  mysql:
    image: mysql:8.0
    container_name: aa_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: antonio_augusta
      MYSQL_USER: aa_user
      MYSQL_PASSWORD: aa_secret
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - aa_network

  # Redis
  redis:
    image: redis:alpine
    container_name: aa_redis
    ports:
      - "6379:6379"
    networks:
      - aa_network

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: aa_phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: aa_user
      PMA_PASSWORD: aa_secret
    depends_on:
      - mysql
    networks:
      - aa_network

networks:
  aa_network:
    driver: bridge

volumes:
  mysql_data:
